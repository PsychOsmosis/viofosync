services:
  viofosync:
    image: tt99112/viofosync:latest
    container_name: viofosync
    restart: unless-stopped

    # Run as your NAS user if you do not want root-owned recordings.
    # user: "1000:1000"

    # Intel iGPU for STACK_CAMERAS hardware encoding.
    # devices:
    #   - /dev/dri:/dev/dri

    volumes:
      # NAS recording destination.
      - /dashcam-recordings:/recordings:rw

      # Optional source for SD card / SSD / copied dashcam files.
      # - /path/to/mounted/dashcam-drive:/import:rw
      #
      # For faster same-volume local moves, mount the parent folder once:
      # - /path/to/Dash_Cam_Footage:/dashcam:rw
      # Then set DESTINATION=/dashcam/Sync and IMPORT_SOURCE=/dashcam/SSD.

    environment:
      # Wi-Fi sync. Leave empty when using IMPORT_SOURCE only.
      ADDRESS: ''
      DESTINATION: /recordings

      TZ: Europe/London
      GROUPING: daily
      PRIORITY: date
      KEEP: 2w

      # Run interval in seconds when RUN_ONCE is not set.
      SYNC_INTERVAL: 600

      MAX_USED_DISK: 90
      TIMEOUT: 10
      DOWNLOAD_ATTEMPTS: 1
      VERBOSE: 0
      QUIET: 0

      # Optional modes. Use 1 to enable, 0 to disable.
      HTML: 0
      READ_ONLY: 0
      GPS_EXTRACT: 0
      DELETE_AFTER_SYNC: 0
      DELETE_LOCKED: 0
      DRY_RUN: 0
      RUN_ONCE: 0

      # Local import mode.
      IMPORT_SOURCE: ''
      MOVE_IMPORTED: 0

      # Normal-driving chunk merging. Parking files are not merged.
      MERGE_CHUNKS: 0
      MERGE_GAP: 2
      MERGED_DESTINATION: ''
      DELETE_MERGED_SOURCES: 0

      # Combine separate F/I/R files into one stacked video.
      STACK_CAMERAS: 0
      STACK_ORIGINALS: keep
      STACK_LIMIT: 0
